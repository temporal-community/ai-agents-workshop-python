title: Building Durable AI Agents with Python and Temporal
description: |
  A progressive workshop that shows how to build production-grade AI
  agents using the OpenAI Agents SDK and Temporal for durable execution. Starting
  from a hand-written agentic loop, you will add the OpenAI Agents SDK integration,
  MCP tool servers, human-in-the-loop signals, multi-agent orchestration, and
  heterogeneous agent frameworks, observing each step in the Temporal Web UI.
